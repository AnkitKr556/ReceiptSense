[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receiptsense"
version = "1.0.0"
description = "Receipt-driven expense tracker with OCR and ML-based auto categorization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
    "scikit-learn>=1.3",
    "Pillow>=10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "pytest-cov>=4", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
receiptsense = "expense_tracker.cli:main"
expense-tracker = "expense_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expense_tracker = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["expense_tracker"]
